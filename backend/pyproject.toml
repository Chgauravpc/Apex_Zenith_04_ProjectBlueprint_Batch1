[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Python 3.9 house style uses typing.List/Optional (see ENGINEERING.md §2).
ignore = ["UP006", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real Groq/OpenRouter APIs (needs keys)"]
addopts = "-m 'not live'"
