[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Python 3.9 house style uses typing.List/Optional (see ENGINEERING.md §2).
ignore = ["UP006", "UP007", "UP035"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: calls real Groq/OpenRouter APIs (needs keys)",
  "postgres: needs TEST_DATABASE_URL pointing at a throwaway Postgres",
]
addopts = "-m 'not live and not postgres'"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as call defaults; that is intended.
extend-immutable-calls = [
  "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Path",
  "fastapi.Body", "fastapi.params.Depends",
]
